name: Quality Linting
on: [pull_request]
jobs:
    Check-Code-Quality:
        name: EsLint Check [Ubuntu]
        run-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node_version: "lts/hydrogen"
            - run: npm ci
            - run: npm run lint:eslint:check
